
@'
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Dashboard | InternMatch</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <style>
        body.company-dashboard {
            min-height: 100vh;
            margin: 0;
            padding: 32px 20px;
            box-sizing: border-box;
            color: #f8fafc;
            background:
                radial-gradient(ellipse at 10% 0%, rgba(37,99,235,.18), transparent 40%),
                radial-gradient(ellipse at 90% 100%, rgba(129,140,248,.12), transparent 35%),
                #080d1b;
        }
        .dashboard-container {
            max-width: 1100px;
            margin: auto;
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }
        .dashboard-header h1 {
            margin: 0 0 8px;
            font-size: clamp(26px, 4vw, 36px);
            color: #f8fafc;
        }
        #companyInfo { margin: 0; color: #94a3b8; }
        .dashboard-card {
            box-sizing: border-box;
            margin-bottom: 24px;
            padding: 28px;
            border: 1px solid rgba(148,163,184,.18);
            border-radius: 20px;
            background: linear-gradient(145deg,rgba(21,31,53,.97),rgba(14,23,42,.98));
            box-shadow: 0 18px 45px rgba(0,0,0,.2);
        }
        .dashboard-card h2 {
            margin: 0 0 22px;
            color: #f8fafc;
            font-size: 21px;
        }
        .dashboard-form {
            display: grid;
            grid-template-columns: repeat(2,minmax(0,1fr));
            gap: 16px;
        }
        .form-field { min-width: 0; }
        .form-field.full-width { grid-column: 1 / -1; }
        .dashboard-form label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
        }
        .dashboard-form input,
        .dashboard-form textarea {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border: 1px solid #334155;
            border-radius: 10px;
            background: #0b1325;
            color: #f8fafc;
            font: inherit;
        }
        .dashboard-form textarea {
            min-height: 100px;
            resize: vertical;
        }
        .dashboard-form input:focus,
        .dashboard-form textarea:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56,189,248,.12);
        }
        .dashboard-btn {
            border: 0;
            border-radius: 10px;
            padding: 12px 20px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg,#2563eb,#7c3aed);
            transition: transform .2s, opacity .2s;
        }
        .dashboard-btn:hover { transform: translateY(-1px); opacity: .92; }
        .dashboard-form .dashboard-btn { grid-column: 1 / -1; }
        #logout {
            background: rgba(239,68,68,.12);
            border: 1px solid rgba(248,113,113,.4);
            color: #fca5a5;
        }
        #message { color: #7dd3fc; margin: 0 0 20px; }
        .item-card {
            padding: 18px;
            margin-bottom: 12px;
            border: 1px solid #334155;
            border-radius: 12px;
            background: rgba(11,19,37,.7);
            overflow-wrap: anywhere;
        }
        .item-card h3 { margin: 0 0 10px; color: #7dd3fc; }
        .item-card p { color: #cbd5e1; line-height: 1.6; }
        .empty-state { padding: 20px 0; color: #94a3b8; }
        @media (max-width: 600px) {
            body.company-dashboard { padding: 20px 14px; }
            .dashboard-card { padding: 20px 16px; }
            .dashboard-form { grid-template-columns: 1fr; }
            .form-field.full-width,
            .dashboard-form .dashboard-btn { grid-column: auto; }
        }
    </style>
</head>
<body class="company-dashboard">
<main class="dashboard-container">
    <header class="dashboard-header">
        <div>
            <h1>Company Dashboard</h1>
            <p id="companyInfo">Loading company details...</p>
        </div>
        <button id="logout" class="dashboard-btn" type="button">Logout</button>
    </header>

    <p id="message" role="status" aria-live="polite"></p>

    <section class="dashboard-card">
        <h2>Post Internship</h2>
        <form id="internshipForm" class="dashboard-form">
            <div class="form-field">
                <label for="title">Internship Title *</label>
                <input id="title" required maxlength="200" placeholder="e.g. Frontend Developer Intern">
            </div>
            <div class="form-field">
                <label for="location">Location</label>
                <input id="location" placeholder="e.g. Chennai / Remote">
            </div>
            <div class="form-field full-width">
                <label for="description">Description</label>
                <textarea id="description" placeholder="Describe the internship role..."></textarea>
            </div>
            <div class="form-field">
                <label for="duration">Duration</label>
                <input id="duration" placeholder="e.g. 3 months">
            </div>
            <div class="form-field">
                <label for="stipend">Stipend</label>
                <input id="stipend" placeholder="e.g. ₹10,000/month">
            </div>
            <div class="form-field full-width">
                <label for="skills">Required Skills</label>
                <input id="skills" placeholder="e.g. HTML, CSS, JavaScript">
            </div>
            <button class="dashboard-btn" type="submit">+ Post Internship</button>
        </form>
    </section>

    <section class="dashboard-card">
        <h2>Your Internships</h2>
        <div id="internships"><p class="empty-state">Loading internships...</p></div>
    </section>

    <section class="dashboard-card">
        <h2>Applicants</h2>
        <div id="applicants"><p class="empty-state">Loading applicants...</p></div>
    </section>
</main>

<script>
const API = "https://internmatch-mvp.onrender.com";
const token = localStorage.getItem("accessToken");
const role = localStorage.getItem("userRole");
const headers = () => ({
    "Content-Type": "application/json",
    "Authorization": `Bearer ${token}`
});
const message = text => document.getElementById("message").textContent = text;

if (!token || role !== "company") window.location.href = "login.html";

document.getElementById("logout").onclick = () => {
    ["accessToken", "tokenType", "userRole", "isLoggedIn", "userEmail"]
        .forEach(key => localStorage.removeItem(key));
    window.location.href = "login.html";
};

async function loadCompany() {
    const r = await fetch(`${API}/company/me`, { headers: headers() });
    if (!r.ok) throw Error("Could not load company profile.");
    const c = await r.json();
    document.getElementById("companyInfo").textContent =
        `${c.company_name} — ${c.email}`;
}

async function loadInternships() {
    const r = await fetch(`${API}/company/internships`, { headers: headers() });
    if (!r.ok) throw Error("Could not load internships.");
    const items = await r.json();
    const box = document.getElementById("internships");
    box.replaceChildren();

    if (!items.length) {
        const empty = document.createElement("p");
        empty.className = "empty-state";
        empty.textContent = "No internships posted yet.";
        box.append(empty);
        return;
    }

    items.forEach(item => {
        const card = document.createElement("article");
        card.className = "item-card";
        const title = document.createElement("h3");
        title.textContent = item.title;
        const desc = document.createElement("p");
        desc.textContent = item.description || "No description provided.";
        const details = document.createElement("p");
        details.textContent = [
            item.location, item.duration, item.stipend, item.skills_required
        ].filter(Boolean).join(" · ");
        card.append(title, desc, details);
        box.append(card);
    });
}

async function loadApplicants() {
    const r = await fetch(`${API}/company/applications`, { headers: headers() });
    if (!r.ok) throw Error("Could not load applicants.");
    const items = await r.json();
    const box = document.getElementById("applicants");
    box.replaceChildren();

    if (!items.length) {
        const empty = document.createElement("p");
        empty.className = "empty-state";
        empty.textContent = "No applicants yet.";
        box.append(empty);
        return;
    }

    items.forEach(item => {
        const card = document.createElement("article");
        card.className = "item-card";
        const title = document.createElement("h3");
        title.textContent = item.internship_title;
        const student = document.createElement("p");
        student.textContent = `${item.student_name} (${item.student_email})`;
        const status = document.createElement("p");
        status.textContent = `Status: ${item.status}`;
        card.append(title, student, status);
        box.append(card);
    });
}

document.getElementById("internshipForm").addEventListener("submit", async e => {
    e.preventDefault();
    const button = e.submitter;
    button.disabled = true;
    button.textContent = "Posting...";

    const payload = {
        title: document.getElementById("title").value.trim(),
        description: document.getElementById("description").value.trim(),
        location: document.getElementById("location").value.trim(),
        duration: document.getElementById("duration").value.trim(),
        stipend: document.getElementById("stipend").value.trim(),
        skills_required: document.getElementById("skills").value.trim()
    };

    try {
        const r = await fetch(`${API}/company/internships`, {
            method: "POST",
            headers: headers(),
            body: JSON.stringify(payload)
        });
        const data = await r.json();

        if (!r.ok) {
            message(data.detail || "Could not post internship.");
            return;
        }

        e.target.reset();
        message("Internship posted successfully!");
        await loadInternships();
    } catch {
        message("Server connection failed. Try again.");
    } finally {
        button.disabled = false;
        button.textContent = "+ Post Internship";
    }
});

(async () => {
    if (!token || role !== "company") return;
    try {
        await loadCompany();
        await Promise.all([loadInternships(), loadApplicants()]);
    } catch (e) {
        message(e.message);
    }
})();
</script>
</body>
</html>
